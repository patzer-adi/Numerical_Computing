[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynumerics"
version = "0.1.0"
description = "A modular Python library for numerical methods — matrix algebra, linear system solvers, root-finding algorithms, and complex number arithmetic."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aditya Gowari"}
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
